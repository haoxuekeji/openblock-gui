name: Pull Request Check

on:
  pull_request:
    branches: [ develop, main, desktop ]
    paths-ignore:
      - 'README.md'
      - 'doc/*'

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      NPM_TAG: latest

    strategy:
      matrix:
        # Node 24 is the release baseline (see OB-030/OB-031 release manifests).
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # postinstall (scripts/setup-local-deps.js) 在无兄弟仓库的 CI 环境自动跳过，
      # 使用 registry / github 依赖构建。
      - run: npm ci

      # Real unit test gate: 39 suites (components/containers/reducers/util).
      # project-saver-hoc.test.jsx is quarantined via testPathIgnorePatterns
      # (upstream scratch web-platform save flow, not used by this distribution);
      # run `npm run test:unit:known-divergence` locally for visibility.
      - name: Unit tests
        run: npm run test:unit -- --maxWorkers=2

      # lint 存在历史遗留错误（OB-030 已知事项 #5），暂不作为门禁。
      - name: Lint (non-gating)
        run: npx eslint . --ext .js,.jsx --quiet || true

      - name: Build
        env:
          NODE_ENV: production
          GA_ID: ${{ secrets.GA_ID }}
          NODE_OPTIONS: --openssl-legacy-provider --max-old-space-size=8192
        run: npm run build
